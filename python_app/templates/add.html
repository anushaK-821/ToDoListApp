{% extends 'base.html' %} {% block content %}
<div class="header">
  <h1>ToDoReminder</h1>
</div>

<div class="container">
  <div style="text-align: right; margin-bottom: 1rem">
    <a href="{{ url_for('index') }}" class="link">← Back to Tasks</a>
  </div>

  <div class="add-task-section">
    <div class="add-task-title">Add a New Task</div>

    {% if get_flashed_messages() %}
    <div class="flash-wrap">
      {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('add_task') }}">
      <div class="form-grid">
        <div class="form-group">
          <label for="title">Task Name</label>
          <input type="text" id="title" name="title" value="{{ title }}" required placeholder="Enter task name..." />
        </div>
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="low" {{ selected_low }}>Low (3)</option>
            <option value="medium" {{ selected_medium }}>Medium (2)</option>
            <option value="high" {{ selected_high }}>High (1)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" value="{{ date or '' }}" />
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Enter task description...">{{ description }}</textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Add Task</button>
        <a
          href="{{ url_for('index') }}"
          class="btn-primary"
          style="background: #6b7280; text-decoration: none"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock %}
