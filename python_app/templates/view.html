{% extends 'base.html' %} {% block content %}
<section class="card">
  <div class="task-header">
    <h1>{{ task.title }}</h1>
    <span class="badge badge-{{ task.priority or 'low' }}"
      >{{ task.priority or 'low' }}</span
    >
  </div>

  <div class="form-group">
    <label style="color: var(--text-light); font-weight: 400">Task ID</label>
    <p style="font-family: monospace; color: var(--text)">{{ task._id }}</p>
  </div>

  <div class="form-group">
    <label style="color: var(--text-light); font-weight: 400"
      >Description</label
    >
    <p>{{ task.description }}</p>
  </div>

  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 2rem">
    <a class="button" href="{{ url_for('edit_task', task_id=task._id) }}"
      >Edit Task</a
    >
    <a
      class="button"
      style="
        background: transparent;
        border: 2px solid var(--primary);
        color: var(--primary);
      "
      href="{{ url_for('index') }}"
      >Back to List</a
    >
  </div>
</section>
{% endblock %}
